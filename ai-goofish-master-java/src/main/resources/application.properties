spring.datasource.url=jdbc:h2:file:./data/goofishdb;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Force database initialization on every startup, safe to use with idempotent schema.sql
spring.sql.init.mode=always

# Global JSON Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Playwright Configuration
playwright.timeout.ms=90000

# OpenAI Configuration
openai.api.key=sk-acb2639d7de2488b87201868c794ad51
openai.model.name=deepseek-chat
openai.base.url=https://api.deepseek.com/v1

# Email Configuration
spring.mail.host=YOUR_SMTP_HOST
spring.mail.port=587
spring.mail.username=YOUR_EMAIL_USERNAME
spring.mail.password=YOUR_EMAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Proxy Configuration
proxy.enabled=false
proxy.api.url=YOUR_PROXY_API_URL
proxy.refresh.interval.seconds=1800
